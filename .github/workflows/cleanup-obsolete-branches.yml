name: One-time cleanup of obsolete HeadTracker branches

on:
  push:
    branches: [curve-settings-live-graph]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  delete-verified-obsolete-branches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Verify all four branch heads, default branch and ancestry before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/curve-settings-live-graph"
          test "$GITHUB_REPOSITORY" = "celienbr/HeadTracker"
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = "master"
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)" = "de3b17dc09da96dee9839543d8b5b6ee75720e79"
          declare -A expected=(
            [expo-v2.40]=12526c4053de38d0db4503022d96815a97872ff0
            [expo-deadzone]=a264e94dfe507415cebd64b83a905765ae357a96
            [expo-deadzone-graph]=b5264b29a8905f959984f47aa49968221b9fbf1d
            [expo-deadzone-english-ui]=d70c12239808d2d5224ada53d881e74f4592bd92
          )
          for branch in expo-v2.40 expo-deadzone expo-deadzone-graph expo-deadzone-english-ui; do
            sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [[ "$sha" != "${expected[$branch]}" ]]; then
              echo "::error::Branch $branch changed or disappeared; stopping, nothing deleted."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$sha" "$GITHUB_SHA"; then
              echo "::error::Branch $branch is not included in selected Curve Settings branch."
              exit 1
            fi
            test "$(gh api "repos/$GITHUB_REPOSITORY/branches/$branch" --jq .protected)" = "false"
            echo "Verified safely preserved in final history: $branch @ $sha"
          done
          for branch in expo-v2.40 expo-deadzone expo-deadzone-graph expo-deadzone-english-ui; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted obsolete branch: $branch"
          done
          echo "Preserved master and curve-settings-live-graph."
