name: HeadTracker Expo Build
on:
  push:
    branches: [expo-v2.40]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: docker.io/dlktdr/ht_zephyr:3.7.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: modification
      - uses: actions/checkout@v4
        with:
          repository: headtracker/HeadTracker
          ref: v2.40
          path: HT
          submodules: recursive
          fetch-depth: 0
      - name: Modify source
        run: |
          . /root/zephyr_py_env/.venv/bin/activate
          python modification/appliquer_expo_gui.py HT
      - name: Build firmwares
        run: |
          . /root/zephyr_py_env/.venv/bin/activate
          export ZEPHYR_BASE=/root/zephyr/zephyr
          cd /root/zephyr-sdk && ./setup.sh -c
          cd "$GITHUB_WORKSPACE/HT/firmware/src"
          mkdir -p "$GITHUB_WORKSPACE/firmwares"
          west build -p always -b arduino_nano_33_ble
          cp build/zephyr/*.bin "$GITHUB_WORKSPACE/firmwares/Nano33BLE.bin"
          west build -p always -b arduino_nano_33_ble -- -DBOARD_REV2=y
          cp build/zephyr/*.bin "$GITHUB_WORKSPACE/firmwares/Nano33BLE-Rev2.bin"
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTracker-Expo-Firmwares
          path: firmwares/*.bin
  gui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: modification
      - uses: actions/checkout@v4
        with:
          repository: headtracker/HeadTracker
          ref: v2.40
          path: HT
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.1'
          target: desktop
          arch: win64_mingw
          modules: qtserialport
          tools: 'tools_mingw90,qt.tools.win64_mingw900'
      - name: Compile Qt
        shell: pwsh
        run: |
          python modification/appliquer_expo_gui.py HT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          g++ --version
          mingw32-make --version
          Push-Location HT/gui/src
          qmake HeadTracker.pro
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mingw32-make -j2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          mkdir output
          Copy-Item HT/gui/src/release/* output/ -Recurse -Force
          # Packaging Qt explicite pour eviter le defaut du plugin platforme
          $qtbin = Join-Path $env:QT_ROOT_DIR 'bin'
          $qtplugins = Join-Path $env:QT_ROOT_DIR 'plugins'
          $qtDlls = @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Network.dll', 'Qt6Widgets.dll',
                      'Qt6SerialPort.dll', 'Qt6OpenGL.dll', 'Qt6OpenGLWidgets.dll',
                      'Qt6Svg.dll')
          foreach ($dll in $qtDlls) {
            $src = Join-Path $qtbin $dll
            if (!(Test-Path $src)) { throw "Bibliotheque Qt absente : $src" }
            Copy-Item $src output/
          }
          New-Item -ItemType Directory -Force output/platforms | Out-Null
          Copy-Item (Join-Path $qtplugins 'platforms/qwindows.dll') output/platforms/
          # Autres plugins usuels pour les images et les connexions reseau
          foreach ($plugin in @('imageformats','styles','tls','networkinformation')) {
            $src = Join-Path $qtplugins $plugin
            if (Test-Path $src) { Copy-Item $src (Join-Path 'output' $plugin) -Recurse -Force }
          }
          $compilerBin = Split-Path (Get-Command g++.exe -ErrorAction Stop).Source
          foreach ($runtime in @('libgcc_s_seh-1.dll','libstdc++-6.dll','libwinpthread-1.dll')) {
            $src = Join-Path $compilerBin $runtime
            if (!(Test-Path $src)) { throw "Runtime MinGW absent : $src" }
            Copy-Item $src output/
          }
          Copy-Item HT/gui/bin/bossac.exe output/ -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTracker-Expo-Windows-Portable
          path: output/
  installer:
    needs: [firmware, gui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: modification
      - uses: actions/download-artifact@v4
        with:
          name: HeadTracker-Expo-Windows-Portable
          path: package/gui
      - uses: actions/download-artifact@v4
        with:
          name: HeadTracker-Expo-Firmwares
          path: package/firmware
      - name: Create setup with Linux NSIS
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis
          cp modification/ci/installateur.nsi .
          makensis -V3 installateur.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: HeadTracker-Expo-Setup
          path: HeadTracker-Expo-Setup.exe
